<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Heures Supp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
  padding: 16px;
}
.container {
  max-width: 500px;
  margin: 0 auto;
}
header {
  text-align: center;
  margin-bottom: 20px;
}
header h1 {
  font-size: 1.3rem;
  margin-bottom: 12px;
  color: #16213e;
}
.sync-status {
  font-size: .75rem;
  color: #888;
  margin-bottom: 8px;
}
.sync-status.error { color: #e74c3c; }
.sync-status.ok { color: #27ae60; }
.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.nav button {
  background: #0f3460;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 1rem;
  cursor: pointer;
  transition: background .2s;
}
.nav button:hover { background: #16213e; }
.nav span {
  font-size: 1.1rem;
  font-weight: 600;
  min-width: 180px;
  text-align: center;
  text-transform: capitalize;
}
.days {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  overflow: hidden;
  margin-bottom: 16px;
}
.day-row {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #eee;
}
.day-row:last-child { border-bottom: none; }
.day-row.weekend {
  background: #f8f9fa;
  color: #aaa;
}
.day-label {
  flex: 1;
  font-size: .95rem;
}
.day-label .dow {
  font-weight: 600;
  margin-right: 4px;
}
.day-row.weekend .day-label::after {
  content: ' (repos)';
  font-size: .8rem;
  color: #ccc;
}
.day-row input {
  width: 70px;
  text-align: center;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 6px 4px;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s;
}
.day-row input:focus { border-color: #0f3460; }
.day-row.weekend input {
  background: #f0f0f0;
  color: #bbb;
}
.total-bar {
  background: #0f3460;
  color: #fff;
  border-radius: 12px;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 12px;
}
.export-btn {
  display: block;
  width: 100%;
  background: #27ae60;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.export-btn:hover { background: #219a52; }

/* Login screen */
.login-screen {
  max-width: 400px;
  margin: 80px auto;
  text-align: center;
}
.login-screen h1 {
  font-size: 1.3rem;
  color: #16213e;
  margin-bottom: 8px;
}
.login-screen p {
  font-size: .9rem;
  color: #888;
  margin-bottom: 20px;
}
.login-screen input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 1rem;
  outline: none;
  margin-bottom: 12px;
  text-align: center;
}
.login-screen input:focus { border-color: #0f3460; }
.login-screen button {
  width: 100%;
  background: #0f3460;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.login-screen button:hover { background: #16213e; }
.login-screen .error { color: #e74c3c; font-size: .85rem; margin-bottom: 12px; }
.login-screen .hint { font-size: .8rem; color: #aaa; margin-top: 12px; }
.hidden { display: none; }
</style>
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="loginScreen">
  <h1>Suivi Heures Supplementaires</h1>
  <p>Entre ton code secret pour synchroniser tes donnees entre tes PC</p>
  <div class="error hidden" id="loginError"></div>
  <input type="text" id="codeInput" placeholder="Ton code secret" autocomplete="off">
  <button id="loginBtn">Acceder</button>
  <div class="hint">Meme code = memes donnees sur tous tes PC</div>
</div>

<!-- App -->
<div class="container hidden" id="app">
  <header>
    <h1>Suivi Heures Supplementaires</h1>
    <div class="sync-status" id="syncStatus">Connexion...</div>
    <div class="nav">
      <button id="prev">&#9664; Prec.</button>
      <span id="monthLabel"></span>
      <button id="next">Suiv. &#9654;</button>
    </div>
  </header>
  <div class="days" id="days"></div>
  <div class="total-bar">
    <span>Total du mois</span>
    <span id="total">0 h</span>
  </div>
  <button class="export-btn" id="export">Exporter Excel</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC3IiVNyY2wuKcaZ0cWdPZjwVv1qfACI7A",
  authDomain: "heures-supp-7d077.firebaseapp.com",
  databaseURL: "https://heures-supp-7d077-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "heures-supp-7d077",
  storageBucket: "heures-supp-7d077.firebasestorage.app",
  messagingSenderId: "1096542218339",
  appId: "1:1096542218339:web:334b0af18c2a1ce790f056"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS = ['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];

let currentDate = new Date();
let data = {};
let dbRef = null;
let saveTimeout = null;

const syncEl = document.getElementById('syncStatus');
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('app');

function setSync(msg, cls) {
  syncEl.textContent = msg;
  syncEl.className = 'sync-status ' + (cls || '');
}

// Simple hash du code secret pour creer un ID unique
function hashCode(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return 'u' + Math.abs(hash).toString(36);
}

// Login
function startApp(code) {
  var userId = hashCode(code);
  dbRef = db.ref('users/' + userId + '/heures');

  loginScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
  localStorage.setItem('heures-supp-code', code);
  setSync('Connexion...', '');

  dbRef.on('value', function(snap) {
    data = snap.val() || {};
    render();
    setSync('Synchronise', 'ok');
  }, function(err) {
    setSync('Erreur : ' + err.message, 'error');
  });
}

document.getElementById('loginBtn').addEventListener('click', function() {
  var code = document.getElementById('codeInput').value.trim();
  if (code.length < 3) {
    var errEl = document.getElementById('loginError');
    errEl.textContent = '3 caracteres minimum';
    errEl.classList.remove('hidden');
    return;
  }
  startApp(code);
});

document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

// Auto-login si code deja sauvegarde
var savedCode = localStorage.getItem('heures-supp-code');
if (savedCode) {
  startApp(savedCode);
}

function save() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(function() {
    if (dbRef) {
      dbRef.set(data).then(function() {
        setSync('Synchronise', 'ok');
      }).catch(function() {
        setSync('Erreur de sync', 'error');
      });
    }
  }, 500);
}

function getKey(y, m, d) {
  return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}

function render() {
  var y = currentDate.getFullYear();
  var m = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = MOIS[m] + ' ' + y;
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var container = document.getElementById('days');
  container.innerHTML = '';

  for (var d = 1; d <= daysInMonth; d++) {
    var dow = new Date(y, m, d).getDay();
    var isWeekend = dow === 0 || dow === 6;
    var key = getKey(y, m, d);
    var row = document.createElement('div');
    row.className = 'day-row' + (isWeekend ? ' weekend' : '');

    var label = document.createElement('div');
    label.className = 'day-label';
    label.innerHTML = '<span class="dow">' + JOURS[dow] + '</span> ' + d;

    var input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.step = '0.5';
    input.placeholder = '0';
    input.dataset.key = key;
    if (data[key]) input.value = data[key];

    input.addEventListener('input', function() {
      var v = parseFloat(this.value);
      if (this.value === '') { delete data[this.dataset.key]; }
      else { data[this.dataset.key] = v || 0; }
      save();
      updateTotal();
    });

    row.appendChild(label);
    row.appendChild(input);
    container.appendChild(row);
  }

  updateTotal();
}

function updateTotal() {
  var y = currentDate.getFullYear();
  var m = currentDate.getMonth();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var total = 0;
  for (var d = 1; d <= daysInMonth; d++) {
    total += data[getKey(y, m, d)] || 0;
  }
  document.getElementById('total').textContent = total + ' h';
}

document.getElementById('prev').addEventListener('click', function() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  render();
});
document.getElementById('next').addEventListener('click', function() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  render();
});

document.getElementById('export').addEventListener('click', function() {
  var y = currentDate.getFullYear();
  var m = currentDate.getMonth();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var csv = '\uFEFF' + 'Jour;Date;Heures Supp\n';
  var total = 0;
  for (var d = 1; d <= daysInMonth; d++) {
    var dow = new Date(y, m, d).getDay();
    var key = getKey(y, m, d);
    var val = data[key] || 0;
    total += val;
    var dateStr = String(d).padStart(2,'0') + '/' + String(m+1).padStart(2,'0') + '/' + y;
    var isWE = (dow === 0 || dow === 6) ? ' (WE)' : '';
    csv += JOURS[dow] + isWE + ';' + dateStr + ';' + val + '\n';
  }
  csv += ';Total;' + total + '\n';
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'heures-supp-' + MOIS[m].toLowerCase() + '-' + y + '.csv';
  a.click();
});
</script>
</body>
</html>
